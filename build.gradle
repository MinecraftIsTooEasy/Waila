import java.text.SimpleDateFormat

plugins {
	id 'fml-loom' version '0.1.local'
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

static def buildTime() {
	def df = new SimpleDateFormat("yyyyMMddHHmm")
	df.setTimeZone(TimeZone.getTimeZone("GMT+8"))
	return df.format(new Date())
}

base {
//	archivesName = project.archives_base_name + "-dev-build." + buildTime()
//	archivesName = project.archives_base_name + "-pre-release." + buildTime()
	archivesName = "[高亮信息显示]" + project.archives_base_name
}

repositories {
	mavenLocal()
	maven {
		name = "Spongepowered"
		url = "https://repo.spongepowered.org/repository/maven-public/"
	}
}

loom {
	accessWidenerPath = file("src/main/resources/waila.accesswidener")
	mergedMinecraftJar()
    setFML(new File("${lib_dir}/${fml_file_name}${fml_version}.jar"))
	mods {
		"Waila" {
			sourceSet sourceSets.main
		}
	}

}

tasks.named('runClient', JavaExec).configure { exec ->
    def user = project.hasProperty('username') ? project.username : 'Dev'
    exec.setArgs(['--username', user, '--session', '0', '--width', '854', '--height', '480'])
}

dependencies {

	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.fmlMCPMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation("it.unimi.dsi:fastutil:8.5.12")

//	implementation files("${lib_dir}/RustedIronCore-1.5.0.jar")

	implementation files("${lib_dir}/ManyLib-2.2.1.jar")
	implementation files("${lib_dir}/ModMenu-1.0.0.jar")
	implementation files("${lib_dir}/EMI-1.1.18.jar")
	implementation files(loom.getFML().toPath())
}

processResources {
	inputs.property "version", project.version

	filesMatching("fml.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
}

publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java
		}
	}

	repositories {
	}
}
